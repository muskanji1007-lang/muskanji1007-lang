<svg width="700" height="200" viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <clipPath id="shell"><rect x="0" y="0" width="700" height="200" rx="16"/></clipPath>
  <g clip-path="url(#shell)">
    <rect x="0" y="0" width="700" height="200" fill="url(#bgGrad)"/>
    <text x="24" y="30" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="14" font-weight="700" fill="#38BDF8">🏆 Achievements • muskanji1007-lang</text>
    <line x1="20" y1="40" x2="680" y2="40" stroke="#6366F1" stroke-opacity="0.35"/>

    <!-- Trophy 1: Pull Shark (Gold) -->
    <g transform="translate(20, 52)">
      <rect x="0" y="0" width="154" height="120" rx="12" fill="#0E1626" stroke="#F59E0B" stroke-width="1.4" stroke-opacity="0.7"/>
      <circle cx="77" cy="34" r="20" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
      <path d="M 68,34 l 5,10 11,1.4 -8,7.6 2,11 -10,-5.6 -10,5.6 2,-11 -8,-7.6 11,-1.4 z" transform="translate(0,-9)" fill="#FDE68A"/>
      <text x="77" y="78" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#F1F5F9">Pull Shark</text>
      <text x="77" y="94" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="600" fill="#F59E0B">GOLD</text>
      <g clip-path="url(#tclip0)">
        <clipPath id="tclip0"><rect x="0" y="0" width="154" height="120" rx="12"/></clipPath>
        <rect x="-160" y="-20" width="50" height="160" fill="url(#shineGrad)" transform="rotate(20)">
          <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 260,0" dur="3s" begin="0.4s" repeatCount="indefinite" calcMode="linear"/>
        </rect>
      </g>
    </g>

    <!-- Trophy 2: Quickdraw (Bronze) -->
    <g transform="translate(188, 52)">
      <rect x="0" y="0" width="154" height="120" rx="12" fill="#0E1626" stroke="#C2793A" stroke-width="1.4" stroke-opacity="0.7"/>
      <circle cx="77" cy="34" r="20" fill="none" stroke="#C2793A" stroke-width="2.5"/>
      <path d="M 68,34 l 5,10 11,1.4 -8,7.6 2,11 -10,-5.6 -10,5.6 2,-11 -8,-7.6 11,-1.4 z" transform="translate(0,-9)" fill="#F0C9A1"/>
      <text x="77" y="78" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#F1F5F9">Quickdraw</text>
      <text x="77" y="94" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="600" fill="#C2793A">BRONZE</text>
      <g clip-path="url(#tclip1)">
        <clipPath id="tclip1"><rect x="0" y="0" width="154" height="120" rx="12"/></clipPath>
        <rect x="-160" y="-20" width="50" height="160" fill="url(#shineGrad)" transform="rotate(20)">
          <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 260,0" dur="3s" begin="1.1s" repeatCount="indefinite" calcMode="linear"/>
        </rect>
      </g>
    </g>

    <!-- Trophy 3: Starstruck (Gold) -->
    <g transform="translate(356, 52)">
      <rect x="0" y="0" width="154" height="120" rx="12" fill="#0E1626" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.8"/>
      <circle cx="77" cy="34" r="20" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
      <path d="M 68,34 l 5,10 11,1.4 -8,7.6 2,11 -10,-5.6 -10,5.6 2,-11 -8,-7.6 11,-1.4 z" transform="translate(0,-9)" fill="#BAE6FD"/>
      <text x="77" y="78" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#F1F5F9">Starstruck</text>
      <text x="77" y="94" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="600" fill="#38BDF8">CYAN STAR</text>
      <g clip-path="url(#tclip2)">
        <clipPath id="tclip2"><rect x="0" y="0" width="154" height="120" rx="12"/></clipPath>
        <rect x="-160" y="-20" width="50" height="160" fill="url(#shineGrad)" transform="rotate(20)">
          <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 260,0" dur="3s" begin="1.8s" repeatCount="indefinite" calcMode="linear"/>
        </rect>
      </g>
    </g>

    <!-- Trophy 4: Pair Extraordinaire (Electric Indigo) -->
    <g transform="translate(524, 52)">
      <rect x="0" y="0" width="154" height="120" rx="12" fill="#0E1626" stroke="#818CF8" stroke-width="1.4" stroke-opacity="0.8"/>
      <circle cx="77" cy="34" r="20" fill="none" stroke="#818CF8" stroke-width="2.5"/>
      <path d="M 68,34 l 5,10 11,1.4 -8,7.6 2,11 -10,-5.6 -10,5.6 2,-11 -8,-7.6 11,-1.4 z" transform="translate(0,-9)" fill="#C7D2FE"/>
      <text x="77" y="78" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" fill="#F1F5F9">Pair Dev</text>
      <text x="77" y="94" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="600" fill="#818CF8">INDIGO</text>
      <g clip-path="url(#tclip3)">
        <clipPath id="tclip3"><rect x="0" y="0" width="154" height="120" rx="12"/></clipPath>
        <rect x="-160" y="-20" width="50" height="160" fill="url(#shineGrad)" transform="rotate(20)">
          <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 260,0" dur="3s" begin="2.5s" repeatCount="indefinite" calcMode="linear"/>
        </rect>
      </g>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="698.5" height="198.5" rx="15.5" fill="none" stroke="#6366F1" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>
