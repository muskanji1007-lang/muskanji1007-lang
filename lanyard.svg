<svg width="340" height="620" viewBox="0 0 340 620" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#080B12" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="avatarRingGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="170" cy="285" r="58"/>
    </clipPath>
    <clipPath id="cardClip">
      <rect x="55" y="190" width="230" height="340" rx="18"/>
    </clipPath>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Lanyard Strap -->
  <g transform="translate(0, -20)">
    <path d="M 152,-10 L 152,145 L 188,145 L 188,-10 Z" fill="url(#strapGrad)"/>
    <text x="170" y="80" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" font-weight="700" fill="#080B12" transform="rotate(-90 170 80)" letter-spacing="3">ENGINEER</text>
    
    <!-- Metal Clip & Buckle -->
    <rect x="146" y="138" width="48" height="18" rx="4" fill="#64748B" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="156" y="156" width="28" height="30" rx="6" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="170" cy="171" r="5" fill="#0F172A"/>
    <path d="M 162,184 L 178,184 L 174,198 L 166,198 Z" fill="#94A3B8"/>
  </g>

  <!-- ID Card Container with Shadow -->
  <g filter="url(#softShadow)">
    <!-- Card Base -->
    <rect x="55" y="190" width="230" height="340" rx="18" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.6"/>

    <!-- Lanyard Punch Hole -->
    <rect x="152" y="200" width="36" height="7" rx="3.5" fill="#080B12" stroke="#1E293B" stroke-width="1"/>

    <!-- Access All Areas Bar -->
    <text x="170" y="222" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" font-weight="800" fill="#38BDF8" letter-spacing="3.5">ACCESS ALL AREAS</text>
    <line x1="75" y1="228" x2="265" y2="228" stroke="#6366F1" stroke-opacity="0.4"/>

    <!-- Avatar Glow & Ring -->
    <circle cx="170" cy="285" r="62" fill="none" stroke="url(#avatarRingGrad)" stroke-width="2.5"/>
    <circle cx="170" cy="285" r="58" fill="#0B0F19"/>

    <!-- Avatar Image -->
    <image href="https://avatars.githubusercontent.com/u/313098878?v=4" x="112" y="227" width="116" height="116" clip-path="url(#avatarClip)"/>

    <!-- Name & Role -->
    <text x="170" y="372" text-anchor="middle" font-family="'JetBrains Mono',sans-serif" font-size="16" font-weight="800" fill="#F8FAFC">Muskan Gupta</text>
    <text x="170" y="392" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" font-weight="600" fill="#38BDF8">Frontend Developer</text>
    <text x="170" y="408" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#94A3B8">B.Tech CSE (Data Science)</text>
    <text x="170" y="422" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="8.5" fill="#64748B">AKGEC, Ghaziabad</text>

    <!-- Barcode & Serial -->
    <line x1="75" y1="440" x2="265" y2="440" stroke="#1E293B" stroke-dasharray="4,3"/>
    
    <!-- Mini Barcode -->
    <g transform="translate(85, 452)" fill="#38BDF8" opacity="0.8">
      <rect x="0" y="0" width="3" height="24"/>
      <rect x="5" y="0" width="1.5" height="24"/>
      <rect x="9" y="0" width="4" height="24"/>
      <rect x="15" y="0" width="2" height="24"/>
      <rect x="19" y="0" width="1" height="24"/>
      <rect x="23" y="0" width="3" height="24"/>
      <rect x="28" y="0" width="5" height="24"/>
      <rect x="36" y="0" width="1.5" height="24"/>
      <rect x="40" y="0" width="3" height="24"/>
      <rect x="46" y="0" width="2" height="24"/>
      <rect x="51" y="0" width="4" height="24"/>
      <rect x="58" y="0" width="1" height="24"/>
      <rect x="62" y="0" width="3" height="24"/>
      <rect x="68" y="0" width="4.5" height="24"/>
      <rect x="75" y="0" width="2" height="24"/>
      <rect x="80" y="0" width="1.5" height="24"/>
      <rect x="84" y="0" width="3" height="24"/>
      <rect x="90" y="0" width="4" height="24"/>
      <rect x="97" y="0" width="2" height="24"/>
      <rect x="102" y="0" width="1.5" height="24"/>
      <rect x="106" y="0" width="3" height="24"/>
      <rect x="112" y="0" width="2" height="24"/>
      <rect x="117" y="0" width="4" height="24"/>
      <rect x="124" y="0" width="1.5" height="24"/>
      <rect x="128" y="0" width="3" height="24"/>
      <rect x="134" y="0" width="5" height="24"/>
      <rect x="142" y="0" width="2" height="24"/>
      <rect x="147" y="0" width="3" height="24"/>
      <rect x="153" y="0" width="1.5" height="24"/>
      <rect x="158" y="0" width="4" height="24"/>
      <rect x="165" y="0" width="2" height="24"/>
    </g>
    <text x="170" y="492" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="7.5" fill="#64748B" letter-spacing="2">ID: 2025-2029 • DEV-PASS</text>

    <!-- Sweeping Glass Reflection Animation -->
    <g clip-path="url(#cardClip)">
      <rect x="-240" y="100" width="70" height="450" fill="url(#shineGrad)" transform="rotate(25 170 360)">
        <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 450,0" dur="4s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </g>
  </g>
</svg>
