<svg width="1280" height="660" viewBox="0 0 1280 660" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121D33" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0A101D" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="avatarCardClip">
      <rect x="880" y="140" width="340" height="460" rx="20"/>
    </clipPath>
  </defs>

  <!-- Shell Background -->
  <rect x="0" y="0" width="1280" height="660" rx="24" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1278" height="658" rx="23" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" stroke-opacity="0.75"/>

  <!-- Top Terminal Bar -->
  <g transform="translate(40, 36)">
    <circle cx="12" cy="12" r="6.5" fill="#EF4444"/>
    <circle cx="32" cy="12" r="6.5" fill="#F59E0B"/>
    <circle cx="52" cy="12" r="6.5" fill="#10B981"/>
    <text x="76" y="16" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" font-weight="600" fill="#64748B">muskanji1007-lang / README.md</text>
  </g>
  <line x1="40" y1="68" x2="1240" y2="68" stroke="#1E293B" stroke-width="1"/>

  <!-- Left Main Content Column -->
  <g transform="translate(60, 110)">
    <!-- Terminal Command Line -->
    <rect x="0" y="0" width="280" height="34" rx="8" fill="#0B111D" stroke="#1E293B"/>
    <text x="14" y="22" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="600" fill="#38BDF8">user@dev:~$ <tspan fill="#F1F5F9">cat README.md</tspan></text>

    <!-- Name Heading -->
    <text x="0" y="95" font-family="'Inter',-apple-system,sans-serif" font-size="52" font-weight="900" fill="url(#nameGrad)" filter="url(#neonGlow)" letter-spacing="-1">Muskan Gupta</text>

    <!-- Role Subtitle -->
    <text x="2" y="132" font-family="'JetBrains Mono',monospace" font-size="17" font-weight="700" fill="#38BDF8">> <tspan fill="#F1F5F9">Frontend Developer</tspan> <tspan fill="#818CF8">@ B.Tech CSE (Data Science) AKGEC</tspan></text>

    <!-- Quote Box -->
    <rect x="0" y="152" width="360" height="34" rx="8" fill="#0B1322" stroke="#6366F1" stroke-opacity="0.4"/>
    <text x="16" y="174" font-family="'JetBrains Mono',monospace" font-size="12" font-style="italic" fill="#94A3B8">"Crafting modern interfaces & decoding data ✨"</text>

    <!-- Tech Stack Mini Pills -->
    <g transform="translate(0, 206)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="35" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="600" fill="#38BDF8">React</text>

      <rect x="78" y="0" width="105" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="130" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="600" fill="#38BDF8">JavaScript</text>

      <rect x="191" y="0" width="115" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="248" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="600" fill="#38BDF8">Tailwind CSS</text>

      <rect x="314" y="0" width="55" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="341" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="600" fill="#38BDF8">C++</text>

      <rect x="377" y="0" width="55" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="404" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="600" fill="#38BDF8">Git</text>

      <rect x="440" y="0" width="55" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.5"/>
      <text x="467" y="17" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" font-weight="600" fill="#38BDF8">Vite</text>
    </g>

    <!-- Bullet Highlights -->
    <g transform="translate(2, 266)">
      <circle cx="5" cy="5" r="4" fill="#38BDF8"/>
      <text x="20" y="9" font-family="'JetBrains Mono',sans-serif" font-size="14" fill="#CBD5E1">Frontend developer shipping responsive <tspan font-weight="700" fill="#38BDF8">React + Tailwind</tspan> platforms</text>

      <circle cx="5" cy="35" r="4" fill="#818CF8"/>
      <text x="20" y="39" font-family="'JetBrains Mono',sans-serif" font-size="14" fill="#CBD5E1">Undergraduate diving into <tspan font-weight="700" fill="#818CF8">Data Science, Analytics & AI/ML</tspan></text>

      <circle cx="5" cy="65" r="4" fill="#C084FC"/>
      <text x="20" y="69" font-family="'JetBrains Mono',sans-serif" font-size="14" fill="#CBD5E1">Passionate about clean code architecture and user-centric UI/UX</text>
    </g>

    <!-- Bottom Stat Badges Row -->
    <g transform="translate(0, 385)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="220" height="70" rx="12" fill="#0D1626" stroke="#1E293B"/>
      <text x="20" y="28" font-family="'JetBrains Mono',monospace" font-size="11" fill="#64748B">EDUCATION</text>
      <text x="20" y="52" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#38BDF8">AKGEC Ghaziabad</text>

      <!-- Box 2 -->
      <rect x="235" y="0" width="220" height="70" rx="12" fill="#0D1626" stroke="#1E293B"/>
      <text x="20" y="28" transform="translate(235,0)" font-family="'JetBrains Mono',monospace" font-size="11" fill="#64748B">DEGREE PROGRAM</text>
      <text x="20" y="52" transform="translate(235,0)" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#818CF8">B.Tech CSE (DS)</text>

      <!-- Box 3 -->
      <rect x="470" y="0" width="220" height="70" rx="12" fill="#0D1626" stroke="#1E293B"/>
      <text x="20" y="28" transform="translate(470,0)" font-family="'JetBrains Mono',monospace" font-size="11" fill="#64748B">BATCH</text>
      <text x="20" y="52" transform="translate(470,0)" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" fill="#38BDF8">2025 – 2029</text>
    </g>
  </g>

  <!-- Right Visual Card (Developer Showcase) -->
  <g>
    <!-- Card Frame -->
    <rect x="880" y="110" width="340" height="490" rx="20" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.6"/>

    <!-- Header Pill -->
    <rect x="940" y="130" width="220" height="28" rx="14" fill="#0B1322" stroke="#6366F1" stroke-opacity="0.5"/>
    <text x="1050" y="148" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" font-weight="800" fill="#38BDF8" letter-spacing="2">KEEP CODING • KEEP GROWING</text>

    <!-- Avatar Showcase -->
    <g transform="translate(930, 180)">
      <!-- Outer Glow Ring -->
      <circle cx="120" cy="120" r="105" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>
      <circle cx="120" cy="120" r="98" fill="#070A10"/>
      <!-- Clip circle for avatar -->
      <clipPath id="avatarRoundClip">
        <circle cx="120" cy="120" r="98"/>
      </clipPath>
      <image href="https://avatars.githubusercontent.com/u/313098878?v=4" x="22" y="22" width="196" height="196" clip-path="url(#avatarRoundClip)"/>
    </g>

    <!-- Info labels below avatar -->
    <text x="1050" y="460" text-anchor="middle" font-family="'Inter',sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">Muskan Gupta</text>
    <text x="1050" y="486" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="600" fill="#38BDF8">@muskanji1007-lang</text>
    <text x="1050" y="512" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#94A3B8">Building impactful software ✨</text>

    <!-- Mini Code Snip -->
    <rect x="910" y="534" width="280" height="42" rx="8" fill="#070C15" stroke="#1E293B"/>
    <text x="925" y="552" font-family="'JetBrains Mono',monospace" font-size="10" fill="#64748B">function <tspan fill="#38BDF8">buildDreams</tspan>() {</text>
    <text x="940" y="567" font-family="'JetBrains Mono',monospace" font-size="10" fill="#F1F5F9">  return code + coffee.<tspan fill="#818CF8">ship</tspan>();</text>

    <!-- Glass Sweep Reflection on Card -->
    <g clip-path="url(#avatarCardClip)">
      <rect x="760" y="50" width="80" height="580" fill="url(#shineGrad)" transform="rotate(25 1050 350)">
        <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 600,0" dur="4s" repeatCount="indefinite" calcMode="linear"/>
      </rect>
    </g>
  </g>
</svg>
